name = "academiasemente"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true
preview_urls = true

# D1 database (create with: npx wrangler d1 create academiasemente-db)
[[d1_databases]]
binding = "DB"
database_name = "academiasemente-db"
database_id = "f53f6896-c776-4c56-a5b8-dc44bfe23f12"

# Optional: bind a KV if we need it later
# [[kv_namespaces]]
# binding = "KV"
# id = "..."

[vars]
# Public / non-secret defaults (override in dashboard if needed)
CLOUDINARY_CLOUD_NAME = "lfoop5b8"
CLOUDINARY_FOLDER = "academiasemente"
# Public catalog URL pattern (raw)
# https://res.cloudinary.com/lfoop5b8/raw/upload/academiasemente/catalog.json
GOOGLE_CLIENT_ID = "609301481037-ki70io8nvim10u59bocriok0a39q6tvt.apps.googleusercontent.com"

# Secrets (set with wrangler secret put ...):
# ADMIN_PASSWORD
# CLOUDINARY_API_KEY
# CLOUDINARY_API_SECRET
# GOOGLE_CLIENT_SECRET
# JWT_SECRET   (random string for student session tokens)
